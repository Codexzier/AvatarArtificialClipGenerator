# Pfade sind relativ zum Projektordner oder absolut.
paths:
  voices_dir: voices          # Unterordner pro TTS-Engine, z. B. voices/piper/*.onnx
  outputs_dir: outputs
  work_dir: .work             # temporäre Dateien
  comfyui_dir: ComfyUI

comfyui:
  host: 127.0.0.1
  port: 8188

limits:
  max_audio_seconds: 10
  chars_per_second: 14        # Richtwert für den Zeichenzähler (nur Schätzung)

tts:
  default_engine: piper
  speed: 1.0                  # 1.0 normal, >1 schneller
  sentence_pause: 0.3         # Sekunden zwischen Sätzen
  effect: none                # none | robot | radio | reverb

video:
  engine: wan_s2v
  fps: 16                     # feste Bildrate von Wan 2.2 S2V
  tail_tolerance_frames: 4    # so viele Frames darf das Video kürzer sein (letztes Bild wird gehalten)
  trim_frames: 3              # Frames, die der "Erstes-Bild-Fix" der offiziellen Vorlage entfernt
  resolutions:
    "480p quer": [832, 480]
    "480p hoch": [480, 832]
    "quadratisch": [480, 480]
    "720p quer": [1280, 720]
    "720p hoch": [720, 1280]
  # Stufen sind Startwerte und können hier angepasst werden.
  quality:
    preview: {steps: 4,  cfg: 1.0, lora: true,  max_seconds: 2}
    fast:    {steps: 4,  cfg: 1.0, lora: true}
    normal:  {steps: 8,  cfg: 1.0, lora: true}
    high:    {steps: 20, cfg: 6.0, lora: false}

engines:
  wan_s2v:
    unet_loader: unet         # unet = safetensors (fp8), gguf = ComfyUI-GGUF
    unet: wan2.2_s2v_14B_fp8_scaled.safetensors
    clip: umt5_xxl_fp8_e4m3fn_scaled.safetensors
    vae: wan_2.1_vae.safetensors
    audio_encoder: wav2vec2_large_english_fp16.safetensors
    lora: wan2.2_t2v_lightx2v_4steps_lora_v1.1_high_noise.safetensors

ui:
  host: 127.0.0.1
  port: 7860
  motion_templates:           # Anzeigename -> englischer Prompt (Wan versteht Englisch am besten)
    "Person spricht ruhig": "A person speaks calmly and naturally, natural lip movement and subtle head motion."
    "Person spricht lebhaft": "A person speaks with lively expression, natural lip movement, small gestures and nodding."
    "Roboter spricht, leichte Kopfbewegung": "A robot speaks, mouth moves in sync with speech, slight head movement, mechanical and steady."
    "Figur spricht freundlich": "A friendly character talks to the camera, smiling slightly, natural lip movement."
